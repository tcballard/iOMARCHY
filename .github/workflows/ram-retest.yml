# Temporary diagnostic: reuse the verified package cache and QEMU kernel from
# run 38484327993, then build current userspace. The main workflow rebuilds both.
name: Cached kernel menu command diagnostic
on:
  pull_request:
    paths:
      - scripts/qemu-evidence.mjs
      - scripts/build-ramboot.sh
      - ramboot/init.c
      - rootfs-overlay/**
      - config/aquamarine-gbm-fallback.patch
      - config/aquamarine-exports.map
      - scripts/build-graphics-candidate.sh
      - scripts/configure-rootfs-desktop.sh
      - config/rootfs-inputs.lock
      - .github/workflows/ram-retest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ram-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install emulator and retrieve the exact built images
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-user-static build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross binutils squashfs-tools cmake ninja-build libpugixml-dev pacman-package-manager libarchive-tools zstd gnupg
          mkdir -p build logs/rootfs
          curl --fail --location --retry 3 --output build/ram-inputs.zip https://nightly.link/tcballard/iOMARCHY/actions/artifacts/11859937920.zip
          echo '722843591011c9276c2ba9cce90a6601f1214bdf4151ddcc71854a655e1d3a0f  build/ram-inputs.zip' | sha256sum -c
          unzip -q build/ram-inputs.zip 'artifacts/qemu/*' 'artifacts/rootfs-download-cache.tar' 'artifacts/CACHE-SHA256SUMS'
          rm build/ram-inputs.zip
          sha256sum -c artifacts/qemu/SHA256SUMS artifacts/CACHE-SHA256SUMS
          mkdir -p downloads
          tar --no-same-owner -xf artifacts/rootfs-download-cache.tar -C downloads
          rm artifacts/rootfs-download-cache.tar
      - name: Build current signed userspace and graphics candidate
        run: |
          mkdir -p build/rootfs
          sudo ./scripts/build-rootfs.sh config/rootfs-inputs.lock
          ./scripts/build-graphics-candidate.sh
          sudo mkdir -p build/rootfs/tree/opt/iomarchy/graphics-candidate
          sudo cp -a artifacts/graphics-candidate/. build/rootfs/tree/opt/iomarchy/graphics-candidate/
          # Capture the command launched by the actual button. Do not invoke
          # menu IPC ourselves or modify the upstream shell/command source.
          cat > build/trace-menu-command <<'TRACE'
          if [[ ${BASH_EXECUTION_STRING:-} == "omarchy-shell shell toggle omarchy.menu "* ]]; then
              exec >> "$XDG_RUNTIME_DIR/menu-command.log" 2>&1
              printf 'IOMARCHY_QEMU_MENU_COMMAND_START uptime=%s\n' "$(cut -d' ' -f1 /proc/uptime)"
              trap 'status=$?; printf "IOMARCHY_QEMU_MENU_COMMAND_RESULT %s\n" "$status"' EXIT
              set -x
          fi
          TRACE
          sudo install -m644 build/trace-menu-command build/rootfs/tree/etc/iomarchy/trace-menu-command
          sudo node <<'NODE'
          const fs = require('fs');
          const path = 'build/rootfs/tree/usr/local/sbin/iomarchy-session-probe';
          let source = fs.readFileSync(path, 'utf8');
          for (const [before, after] of [
            [': > "$XDG_RUNTIME_DIR/quickshell.log"', ': > "$XDG_RUNTIME_DIR/quickshell.log"\n: > "$XDG_RUNTIME_DIR/menu-command.log"'],
            ['"$XDG_RUNTIME_DIR/quickshell.log" &', '"$XDG_RUNTIME_DIR/quickshell.log" "$XDG_RUNTIME_DIR/menu-command.log" &'],
            ['qs --path /usr/share/omarchy/shell >', 'BASH_ENV=/etc/iomarchy/trace-menu-command qs --path /usr/share/omarchy/shell >']
          ]) {
            if (!source.includes(before)) throw new Error('Diagnostic insertion point missing');
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          sudo ./scripts/build-rootfs-squashfs.sh
      - name: Build bootstrap for current verified payload
        id: bootstrap
        run: |
          mkdir -p src/linux/usr
          curl --fail --location --output src/linux/usr/gen_init_cpio.c https://raw.githubusercontent.com/HoolockLinux/linux/6831bc701a6ce059e71e5aaa9488c9195bea6927/usr/gen_init_cpio.c
          ./scripts/build-ramboot.sh
      - name: Boot and interact with the 2 GiB desktop
        run: node scripts/qemu-evidence.mjs ram 2048
      - name: Preserve first menu command result immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-command-2048-${{ github.sha }}
          retention-days: 30
          path: logs/qemu-ram-2048/
      - name: Boot and interact with the reduced-memory desktop
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: node scripts/qemu-evidence.mjs ram 1536
      - name: Preserve exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archived-ram-retest-${{ github.sha }}
          retention-days: 30
          path: |
            logs/qemu-*/
            logs/graphics-*.log
            artifacts/ramboot/SHA256SUMS
            artifacts/ramboot/payload-pin.txt
