# Temporary diagnostic: reuse the verified package cache and QEMU kernel from
# run 38484327993, then build current userspace. The main workflow rebuilds both.
name: Input delivery diagnostic
on:
  push:
    branches: [dev/input-delivery-diagnostic]
permissions:
  contents: read
jobs:
  ram-retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install emulator and retrieve the exact built images
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-user-static build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross binutils squashfs-tools cmake ninja-build libpugixml-dev pacman-package-manager libarchive-tools zstd gnupg
          mkdir -p build logs/rootfs
          curl --fail --location --retry 3 --output build/ram-inputs.zip https://nightly.link/tcballard/iOMARCHY/actions/artifacts/11859937920.zip
          echo '722843591011c9276c2ba9cce90a6601f1214bdf4151ddcc71854a655e1d3a0f  build/ram-inputs.zip' | sha256sum -c
          unzip -q build/ram-inputs.zip 'artifacts/qemu/*' 'artifacts/rootfs-download-cache.tar' 'artifacts/CACHE-SHA256SUMS'
          rm build/ram-inputs.zip
          sha256sum -c artifacts/qemu/SHA256SUMS artifacts/CACHE-SHA256SUMS
          mkdir -p downloads
          tar --no-same-owner -xf artifacts/rootfs-download-cache.tar -C downloads
          rm artifacts/rootfs-download-cache.tar
      - name: Build current signed userspace and graphics candidate
        run: |
          mkdir -p build/rootfs
          sudo ./scripts/build-rootfs.sh config/rootfs-inputs.lock
          ./scripts/build-graphics-candidate.sh
          sudo mkdir -p build/rootfs/tree/opt/iomarchy/graphics-candidate
          sudo cp -a artifacts/graphics-candidate/. build/rootfs/tree/opt/iomarchy/graphics-candidate/
          sudo ./scripts/build-rootfs-squashfs.sh
      - name: Build bootstrap for current verified payload
        id: bootstrap
        run: |
          mkdir -p src/linux/usr
          curl --fail --location --retry 5 --retry-delay 3 --retry-max-time 90 --output src/linux/usr/gen_init_cpio.c https://raw.githubusercontent.com/HoolockLinux/linux/6831bc701a6ce059e71e5aaa9488c9195bea6927/usr/gen_init_cpio.c
          ./scripts/build-ramboot.sh
      - name: Boot and interact with the 2 GiB desktop
        run: node scripts/qemu-evidence.mjs ram 2048
      - name: Preserve first menu command result immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-command-2048-${{ github.sha }}
          retention-days: 30
          path: logs/qemu-ram-2048/
      - name: Boot and interact with the reduced-memory desktop
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: node scripts/qemu-evidence.mjs ram 1536
      - name: Interact at the full iPad panel pixel count in 2 GiB
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: node scripts/qemu-evidence.mjs ram 2048 2048x1536
      - name: Reject corrupt payload
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: node scripts/qemu-evidence.mjs ram-corrupt 1536
      - name: Reject interrupted payload
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: node scripts/qemu-evidence.mjs ram-truncated 1536
      - name: Preserve exact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archived-ram-retest-${{ github.sha }}
          retention-days: 30
          path: |
            logs/qemu-*/
            logs/graphics-*.log
            artifacts/ramboot/SHA256SUMS
            artifacts/ramboot/payload-pin.txt
