# Isolated compositor smoke test; not the full Omarchy configuration.
monitor = , 1024x768@60, auto, 1
# Observe both edges without consuming them. The emulator waits for the guest
# to process button-down before releasing it; a 100 ms host click can outrun
# libinput's debounce timer while ARM instructions are interpreted under TCG.
bindn = , mouse:272, exec, touch /run/user/1000/visual-pointer-down
bindrn = , mouse:272, exec, touch /run/user/1000/visual-pointer-up
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
animations {
    enabled = false
}
debug {
    disable_logs = false
    enable_stdout_logs = true
}
